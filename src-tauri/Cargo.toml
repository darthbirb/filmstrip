[package]
name = "filmstrip"
version = "0.1.0"
description = "A gallery viewer and collection organiser for Windows."
license = "GPL-3.0-or-later"
repository = "https://github.com/darthbirb/filmstrip"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "Filmstrip"
path = "src/main.rs"

[lib]
name = "filmstrip_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
ts-rs = "12.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
webp = { version = "0.3.1", default-features = false }
kamadak-exif = "0.6.1"
# Reveal in Explorer, and Open with the default app.
tauri-plugin-opener = "2"
# A real CF_HDROP copy, so pasting into Explorer produces the file and not its path.
clipboard-win = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
