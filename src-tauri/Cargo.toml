[package]
name = "filmstrip"
version = "0.1.0"
description = "A gallery viewer and collection organiser for Windows."
license = "GPL-3.0-or-later"
repository = "https://github.com/darthbirb/filmstrip"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "Filmstrip"
path = "src/main.rs"

[lib]
name = "filmstrip_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
ts-rs = "12.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
webp = { version = "0.3.1", default-features = false }
kamadak-exif = "0.6.1"
# Reveal in Explorer, and Open with the default app.
tauri-plugin-opener = "2"
# The system's own folder picker: the app draws no part of choosing. DESIGN.md "Shapes".
tauri-plugin-dialog = "2"
# An export's zip, stored and never compressed, so no codec is built in.
zip = { version = "=8.6.0", default-features = false }
# An export names a file from when it was taken, in the zone the pane shows it in.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

# A real CF_HDROP copy, so pasting into Explorer produces the file and not its path.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# MoveFileExW, for a rename that refuses a name already taken where std's replaces it.
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1.11.0"
