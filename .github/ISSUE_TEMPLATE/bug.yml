name: Bug
description: Something that does not work as docs/PRD.md says it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The release or nightly it happened in, or the commit.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
