name: Review

# The gate auto-merge waits on: a passing review of the exact head commit, and no needs-human
# label. DEVELOPMENT.md "Review".
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reviewed at the head commit, and nothing waits on the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx needs-human <<<"$labels"; then
            echo "Labelled needs-human: it merges once the owner removes the label."; exit 1
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot's updates are reviewed by the gates themselves."; exit 0
          fi
          # Only the repository's own people can pass it; anyone may comment on a public repo.
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" --jq \
            "[.[] | select(.commit_id == \"$HEAD\")
                  | select(.author_association == \"OWNER\" or .author_association == \"MEMBER\" or .author_association == \"COLLABORATOR\")
                  | select(.body | test(\"<!-- review: (pass|fail) -->\"))]
             | last | .body // \"\" | capture(\"<!-- review: (?<v>pass|fail) -->\").v // \"\"")
          case "$verdict" in
            pass) echo "Reviewed at ${HEAD::7}: pass." ;;
            fail) echo "Reviewed at ${HEAD::7}: changes asked for."; exit 1 ;;
            *) echo "No review of ${HEAD::7} yet."; exit 1 ;;
          esac
