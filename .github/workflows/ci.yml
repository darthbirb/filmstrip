name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: windows-latest
    timeout-minutes: 30

    # Actions are pinned to commit SHAs. Edge and Rust come with the runner image,
    # so no browser or toolchain is downloaded.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npx --yes pnpm@12.4.1 install --frozen-lockfile

      - name: Lint and format
        run: npx --yes pnpm@12.4.1 lint

      - name: Typecheck
        run: npx --yes pnpm@12.4.1 check

      - name: Component tests
        run: npx --yes pnpm@12.4.1 test

      - name: End-to-end tests
        run: npx --yes pnpm@12.4.1 test:e2e

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
