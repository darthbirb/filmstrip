name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: windows-latest
    timeout-minutes: 30

    # Actions are pinned to commit SHAs. Edge and Rust come with the runner image, so no browser
    # or toolchain is downloaded; ffmpeg is, pinned by version and SHA-256 in its script.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review worktree script
        shell: bash
        run: bash scripts/review-worktree.test.sh "$RUNNER_TEMP"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install
        run: npx --yes pnpm@12.4.1 install --frozen-lockfile

      - name: Lint and format
        run: npx --yes pnpm@12.4.1 lint

      - name: Doc pointers and comment length
        run: npx --yes pnpm@12.4.1 check:docs

      - name: Typecheck
        run: npx --yes pnpm@12.4.1 check

      - name: Component tests
        run: npx --yes pnpm@12.4.1 test

      - name: End-to-end tests
        run: npx --yes pnpm@12.4.1 test:e2e

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Timing tests are found
        shell: pwsh
        run: |
          $listed = cargo test --manifest-path src-tauri/Cargo.toml --locked -- --ignored --list ::timing:: | Select-String -Pattern ': test$'
          if (-not $listed) { Write-Output 'No ignored test matches ::timing::, so the timing step would run nothing'; exit 1 }
          Write-Output "$(@($listed).Count) timing tests found"

      - name: Rust timing tests, one at a time
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked -- --ignored --test-threads=1 ::timing::'

      - name: Fetch the ffmpeg the release carries
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Rust tests that need ffmpeg
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked -- --ignored --skip ::timing::'

      - name: Bindings are current
        shell: bash
        run: |
          stale="$(git status --porcelain -- src/ipc/bindings)"
          if [ -n "$stale" ]; then echo "$stale"; echo "cargo test changed src/ipc/bindings; commit them"; exit 1; fi

  title:
    # The title becomes the squash commit's subject on main. CONTRIBUTING.md "Pull requests".
    name: Title
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits, 72 characters at most
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          if ! printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: [a-z0-9]"; then
            echo "The title must read  type(scope): what changes  — see CONTRIBUTING.md"; exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then echo "The title is ${#TITLE} characters; keep it to 72."; exit 1; fi
