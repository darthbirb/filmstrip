name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]

    # Actions are pinned to commit SHAs. Edge and Rust come with the runner image, so no browser
    # or toolchain is downloaded; ffmpeg is, pinned by version and SHA-256 in its script.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npx --yes pnpm@12.4.1 install --frozen-lockfile

      - name: Component tests
        run: npx --yes pnpm@12.4.1 test


  title:
    # The title becomes the squash commit's subject on main. CONTRIBUTING.md "Pull requests".
    name: Title
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits, 72 characters at most
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          if ! printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: [a-z0-9]"; then
            echo "The title must read  type(scope): what changes  — see CONTRIBUTING.md"; exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then echo "The title is ${#TITLE} characters; keep it to 72."; exit 1; fi
