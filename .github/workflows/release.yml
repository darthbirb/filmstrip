name: Release

# Nightly: main's latest commit, built once a day when it has moved. A vX.Y.Z tag: a release.
# Both carry Filmstrip.zip: the portable Filmstrip.exe, with ffmpeg in tools\ beside it.
# CONTRIBUTING.md "Releases".
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build Filmstrip.exe
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Dependabot's merges land with the workflow token, which starts no push runs, and a push to
      # main is not a release anyway; hence a schedule, skipping a day main did not move.
      - name: Has main moved since the last Nightly?
        id: moved
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ "$built" = "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.moved.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: steps.moved.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Rust cache
        if: steps.moved.outputs.skip != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release

      - name: Install
        if: steps.moved.outputs.skip != 'true'
        run: npx --yes pnpm@12.4.1 install --frozen-lockfile

      - name: Build
        if: steps.moved.outputs.skip != 'true'
        run: npx --yes pnpm@12.4.1 tauri build

      - name: Package with ffmpeg
        if: steps.moved.outputs.skip != 'true'
        shell: pwsh
        run: |
          $folder = 'package/Filmstrip'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item src-tauri/target/release/Filmstrip.exe $folder
          ./scripts/fetch-ffmpeg.ps1 -Into "$folder/tools"
          Compress-Archive -Path "$folder/*" -DestinationPath package/Filmstrip.zip
          $unpacked = (Get-ChildItem -Recurse -File $folder | Measure-Object Length -Sum).Sum
          $zipped = (Get-Item package/Filmstrip.zip).Length
          $size = 'Filmstrip.zip is {0:N0} MB, {1:N0} MB unpacked.' -f ($zipped / 1MB), ($unpacked / 1MB)
          Write-Host $size
          Add-Content $env:GITHUB_STEP_SUMMARY $size

      - name: Publish
        if: steps.moved.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=package/Filmstrip.zip
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          else
            notes="The latest build of main, at ${GITHUB_SHA::7}. Rebuilt daily when main moves."
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create nightly "$zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nightly" --notes "$notes" --prerelease --latest=false
          fi
