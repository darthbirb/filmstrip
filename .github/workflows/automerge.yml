name: Dependabot

# Dependabot's grouped patch and minor updates are reviewed by the gates: this marks each head it
# pushed Reviewed and arms a squash, held by main's ruleset until Gates pass. Its other pull
# requests go through the queue. CONTRIBUTING.md "Pull requests".
on:
  # The base repository's workflow and token, so Dependabot's pull requests can be enabled too.
  # Nothing from the pull request is checked out or run.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  enable:
    name: Enable
    # The group in dependabot.yml; a lone update, usually a major, is reviewed like any other.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.head.ref, '/patch-and-minor-') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mark it reviewed and squash once the checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.event.pull_request.html_url }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success \
            -f context=Review -f description="Dependabot: reviewed by the gates" >/dev/null
          gh pr merge --auto --squash "$URL"
