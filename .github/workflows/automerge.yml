name: Dependabot

# Dependabot's pull requests are reviewed by the gates themselves: this marks each head commit
# Reviewed and arms a squash merge, which the ruleset on main holds until Gates pass.
# CONTRIBUTING.md "Pull requests".
on:
  # The base repository's workflow and token, so Dependabot's pull requests can be enabled too.
  # Nothing from the pull request is checked out or run.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  enable:
    name: Enable
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mark it reviewed and squash once the checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.event.pull_request.html_url }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success \
            -f context=Review -f description="Dependabot: reviewed by the gates" >/dev/null
          gh pr merge --auto --squash "$URL"
