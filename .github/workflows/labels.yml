name: Labels

# Keeps the repository's labels to .github/labels.json. Labels it does not name are left alone.
on:
  schedule:
    - cron: "41 3 * * 1"
  push:
    branches: [main]
    paths: [.github/labels.json, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update each label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r .name <<<"$label")
            gh label create "$name" --repo "$GITHUB_REPOSITORY" --force \
              --color "$(jq -r .color <<<"$label")" \
              --description "$(jq -r .description <<<"$label")"
          done
